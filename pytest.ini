[pytest]
# ──────────────────────────────────────────────────────────────────
# pytest.ini — Gestor Inteligente de Tráfico Urbano (GITU)
# Ejecuta todas las pruebas unitarias desde la raíz del proyecto:
#
#   pytest              → todas las pruebas
#   pytest pc1/tests/   → solo PC1
#   pytest pc2/tests/   → solo PC2
#   pytest -v           → verbose (muestra cada caso)
#   pytest -k "motor"   → filtra por nombre
# ──────────────────────────────────────────────────────────────────

# Directorios donde pytest busca tests
testpaths =
    pc1/tests
    pc2/tests

# Patrones de archivos y funciones de test
python_files  = test_*.py
python_classes = Test*
python_functions = test_*

# Opciones por defecto
addopts =
    --tb=short
    -q

# Filtros de warnings conocidos (ZMQ emite DeprecationWarnings en algunos entornos)
filterwarnings =
    ignore::DeprecationWarning:zmq.*
    ignore::ResourceWarning
